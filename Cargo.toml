[package]
name = "mapvas"
readme = "README.md"
description = "A map viewer with drawing functionality"
version = "0.2.11"
authors = ["Udo Hoffmann <hoffmann.odu@gmail.com>"]
edition = "2024"
keywords = ["map", "openstreetmap", "drawing"]
homepage = "https://github.com/UdHo/mapvas"
repository = "https://github.com/UdHo/mapvas.git"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.9"
image = "0.25.10"
itertools = "0.15.0"
log = "0.4.35"
rayon = "1.12.0"
serde = "1.0.229"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
thiserror = "2.0.21"
tokio = {version = "1.54.1", features = ["full", "tracing"]}
tokio-metrics = { version = "0.5", features = ["rt"] }
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
tower-http = {version = "0.7.1", features = ["trace"]}
tracing = "0.1.44"
serde_json = "1.0.154"
env_logger = "0.11.11"
regex = "1.13.1"
rand = "0.10.3"
clap = {version ="4.6.7", features=["derive"]}
arboard = "3.7.0"
chrono = { version = "0.4.45", features = ["serde"] }
bevy = "0.20.1"
bevy_egui = "0.43.1"
winit = "0.30.13"
egui ={version =  "0.36.0", features = ["serde","bytemuck"]}
egui_extras = { version = "0.36.0", features = ["all_loaders"] }
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }
flexpolyline = "1.0.0"
polyline = "0.11.0"
dirs = "7.0.0"
open = "5"
async-trait = "0.1.92"
urlencoding = "2.1.3"
kml = "0.15.0"
gpx = "0.10.0"
geo-types = "0.7.20"
time = "0.3.55"
mvt-reader = "2.5"
tiny-skia = "0.12"
fontdue = "0.9"
json5 = "1.3.7"
egui_kittest = { version = "0.36.0", features = ["snapshot", "wgpu"] }
rstar = "0.14.0"
earcut = "0.4.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[features]
default = []
profiling = ["puffin", "puffin_http"]

[dev-dependencies]
assert_approx_eq = "1.1.0"
futures = "0.3.34"
rstest = "0.28"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
pedantic = {level = "warn", priority = -1}
module_name_repetitions = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[package.metadata.bundle]
name = "mapvas"
identifier = "io.github.udho.mapvas"
icon = ["assets/macos/mapvas.icns"]
category = "public.app-category.graphics-design"
short_description = "A map viewer with drawing functionality"
